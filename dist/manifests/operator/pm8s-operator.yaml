    pm8s.io/operator: "true"
  name: pm8s-operator-service-account
  namespace: pm8s-system
automountServiceAccountToken: false
spec:
  selector: {}
  template:
    metadata:
      labels: null
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    pm8s.io/operator: "true"
  name: pm8s-operator-role-binding
  namespace: pm8s-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pm8s-operator-role
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: pm8s-operator-service-account
    namespace: pm8s-system
spec:
  selector: {}
  template:
    metadata:
      labels: null
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    pm8s.io/operator: "true"
  name: pm8s-operator-cluster-role-binding
  namespace: pm8s-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pm8s-operator-cluster-role
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: pm8s-operator-service-account
