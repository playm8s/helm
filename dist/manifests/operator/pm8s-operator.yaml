spec:
  selector: {}
  template:
    metadata:
      labels: null
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    pm8s.io/operator: "true"
  name: pm8s-operator
  namespace: pm8s-system
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      pm8s.io/operator: "true"
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        pm8s.io/operator: "true"
    spec:
      automountServiceAccountToken: true
      containers:
        - image: ghcr.io/playm8s/operator:latest
          imagePullPolicy: Always
          name: main
          ports:
            - containerPort: 9000
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 1500m
              memory: 2048Mi
            requests:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsNonRoot: true
      serviceAccountName: pm8s-operator-service-account
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: pm8s-operator-service
  namespace: pm8s-system
spec:
  externalIPs: []
  ports:
    - port: 9000
      targetPort: 9000
  selector:
    pm8s.io/operator: "true"
  type: ClusterIP
  template:
    metadata:
      labels: null
